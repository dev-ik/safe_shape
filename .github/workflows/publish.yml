name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      REQUIRE_RELEASE_TAG: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Resolve release version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - run: npm ci
      - run: npm run prepare:release

      - name: Publish core package
        run: npm publish "./release-artifacts/safe-shape-core-${VERSION}.tgz" --access public

      - name: Publish compatibility package
        run: npm publish "./release-artifacts/safe-shape-compat-${VERSION}.tgz" --access public

      - name: Publish HTTP package
        run: npm publish "./release-artifacts/safe-shape-http-${VERSION}.tgz" --access public

      - name: Publish JSON Schema package
        run: npm publish "./release-artifacts/safe-shape-json-schema-${VERSION}.tgz" --access public

      - name: Publish TypeScript package
        run: npm publish "./release-artifacts/safe-shape-typescript-${VERSION}.tgz" --access public

      - name: Publish validation package
        run: npm publish "./release-artifacts/safe-shape-validation-${VERSION}.tgz" --access public

      - name: Publish CLI package
        run: npm publish "./release-artifacts/safe-shape-cli-${VERSION}.tgz" --access public

      - name: Publish umbrella package
        run: npm publish "./release-artifacts/safe-shape-${VERSION}.tgz" --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            ./release-artifacts/*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "SafeShape v${VERSION}" \
            --generate-notes
