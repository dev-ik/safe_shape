name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Publish core for compat bootstrap, or finish the release
        required: true
        default: release
        type: choice
        options:
          - bootstrap-core
          - release

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      REQUIRE_RELEASE_TAG: 'true'
      ALLOW_ALREADY_PUBLISHED_RELEASE_PACKAGES: 'true'
      RELEASE_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Resolve release version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - run: npm ci
      - run: npm run prepare:release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safe-shape-release-${{ env.VERSION }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Publish established packages
        shell: bash
        run: |
          set -euo pipefail

          publish_if_missing() {
            local package_name="$1"
            local artifact_path="$2"

            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "::notice::Skipping ${package_name}@${VERSION}; it is already published."
              return
            fi

            npm publish "${artifact_path}" --access public
          }

          publish_if_missing \
            "@safe-shape/core" \
            "./release-artifacts/safe-shape-core-${VERSION}.tgz"

          if [[ "${RELEASE_PHASE}" == "bootstrap-core" ]]; then
            echo "::notice::Core bootstrap is complete. Publish @safe-shape/compat@${VERSION} manually before running the release phase."
            exit 0
          fi

          COMPAT_VERSION="$(npm view "@safe-shape/compat@${VERSION}" version 2>/dev/null || true)"
          if [[ "${COMPAT_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Publish @safe-shape/compat@${VERSION} manually, then rerun this workflow."
            exit 1
          fi
          echo "::notice::Using manually published @safe-shape/compat@${VERSION}."

          publish_if_missing \
            "@safe-shape/http" \
            "./release-artifacts/safe-shape-http-${VERSION}.tgz"
          publish_if_missing \
            "@safe-shape/json-schema" \
            "./release-artifacts/safe-shape-json-schema-${VERSION}.tgz"
          publish_if_missing \
            "@safe-shape/typescript" \
            "./release-artifacts/safe-shape-typescript-${VERSION}.tgz"
          publish_if_missing \
            "@safe-shape/validation" \
            "./release-artifacts/safe-shape-validation-${VERSION}.tgz"
          publish_if_missing \
            "@safe-shape/cli" \
            "./release-artifacts/safe-shape-cli-${VERSION}.tgz"
          publish_if_missing \
            "safe-shape" \
            "./release-artifacts/safe-shape-${VERSION}.tgz"

      - name: Create GitHub release
        if: inputs.phase == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            ./release-artifacts/*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "SafeShape v${VERSION}" \
            --generate-notes
